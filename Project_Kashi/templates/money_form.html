{% extends "base.html" %}
{% block title %}{{ mode|capitalize }}{% endblock %}
{% block content %}
<h1>{{ mode|capitalize }} Money</h1>
<form method="POST" class="form">
    <label>Account
        <select name="account_id" required>
            {% for a in accounts %}
            <option value="{{ a.AccountID }}">{{ a.AccountNumber }} - {{ a.Holders }} ({{ a.Balance | money }}) [{{ a.Status }}]</option>
            {% endfor %}
        </select>
    </label>
    <label>Amount (&#8377;) <input type="number" name="amount" min="0.01" step="0.01" required></label>
    <label>Description (optional) <input type="text" name="description" maxlength="200"></label>
    <button class="btn" type="submit">{{ mode|capitalize }}</button>
</form>
{% endblock %}
