{% extends "base.html" %}
{% block title %}Open Account{% endblock %}
{% block content %}
<h1>Open a New Account</h1>
{% if not customers %}
<p>No customers yet. <a href="{{ url_for('new_customer') }}">Register a customer first.</a></p>
{% else %}
<form method="POST" class="form">
    <label>Customer (primary holder)
        <select name="customer_id" required>
            {% for c in customers %}
            <option value="{{ c.CustomerID }}" {% if c.CustomerID == selected %}selected{% endif %}>
                {{ c.FirstName }} {{ c.LastName }} ({{ c.Mobile }})
            </option>
            {% endfor %}
        </select>
    </label>
    <label>Joint holder (optional)
        <select name="joint_customer_id">
            <option value="">-- None --</option>
            {% for c in customers %}
            <option value="{{ c.CustomerID }}">{{ c.FirstName }} {{ c.LastName }} ({{ c.Mobile }})</option>
            {% endfor %}
        </select>
    </label>
    <div class="row">
        <label>Account Type
            <select name="account_type" required>
                <option>Saving</option><option>Current</option><option>Salary</option>
            </select>
        </label>
        <label>Branch
            <select name="branch_id" required>
                {% for b in branches %}<option value="{{ b.BranchID }}">{{ b.BranchName }} - {{ b.City }}</option>{% endfor %}
            </select>
        </label>
    </div>
    <label>Initial Deposit (&#8377;) <input type="number" name="initial_deposit" min="0" step="0.01" value="0"></label>
    <button class="btn" type="submit">Open Account</button>
</form>
{% endif %}
{% endblock %}
