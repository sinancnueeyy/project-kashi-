{% extends "base.html" %}
{% block title %}Transfer{% endblock %}
{% block content %}
<h1>Transfer Money</h1>
<form method="POST" class="form">
    <label>From Account
        <select name="from_account" required>
            {% for a in accounts %}
            <option value="{{ a.AccountID }}">{{ a.AccountNumber }} - {{ a.Holders }} ({{ a.Balance | money }})</option>
            {% endfor %}
        </select>
    </label>
    <label>To Account
        <select name="to_account" required>
            {% for a in accounts %}
            <option value="{{ a.AccountID }}">{{ a.AccountNumber }} - {{ a.Holders }}</option>
            {% endfor %}
        </select>
    </label>
    <label>Amount (&#8377;) <input type="number" name="amount" min="0.01" step="0.01" required></label>
    <label>Note (optional) <input type="text" name="description" maxlength="100"></label>
    <button class="btn" type="submit">Transfer</button>
</form>
{% endblock %}
