{% extends "base.html" %}
{% block title %}New Loan{% endblock %}
{% block content %}
<h1>Create Loan</h1>
<form method="POST" class="form">
    <label>Customer
        <select name="customer_id" required>
            {% for c in customers %}<option value="{{ c.CustomerID }}">{{ c.FirstName }} {{ c.LastName }}</option>{% endfor %}
        </select>
    </label>
    <div class="row">
        <label>Loan Type
            <select name="loan_type"><option>Home Loan</option><option>Education Loan</option><option>Personal Loan</option><option>Vehicle Loan</option></select>
        </label>
        <label>Branch
            <select name="branch_id">{% for b in branches %}<option value="{{ b.BranchID }}">{{ b.BranchName }}</option>{% endfor %}</select>
        </label>
    </div>
    <div class="row">
        <label>Loan Amount (&#8377;) <input type="number" name="amount" min="1" step="0.01" required></label>
        <label>Interest Rate (% per year) <input type="number" name="rate" min="0" max="50" step="0.01" required></label>
    </div>
    <label>Tenure (months) <input type="number" name="tenure" min="1" required></label>
    <button class="btn" type="submit">Create Loan</button>
</form>
{% endblock %}
